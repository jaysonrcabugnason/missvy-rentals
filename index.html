<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miss Vy Dress Rentals</title>
<style>
:root{--bg:#fbf7f4;--card:#fff;--tx:#2a2326;--mut:#7a6d72;--ac:#b0345f;--bd:#eadfe3;--bk:#e5484d;--cl:#f2b134;--mt:#8b8b95;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1a1517;--card:#251e21;--tx:#f3ebee;--mut:#a99ba1;--ac:#e66a97;--bd:#3a2f34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{margin:.2em 0}a{color:var(--ac)}
.mut{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:block}
.card .p{padding:10px}
.ph{aspect-ratio:3/4;background:linear-gradient(135deg,#f6c9d9,#d9b8f0);display:flex;align-items:center;justify-content:center;font-size:3rem;width:100%;object-fit:cover}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;color:#fff;margin-top:4px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.top{display:flex;gap:14px;flex-wrap:wrap}.top .ph{width:200px;border-radius:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.g i{font-style:normal;font-size:.75rem;color:var(--mut)}
.d{padding:8px 0;border-radius:8px;border:1px solid var(--bd)}
.d.Booked{background:var(--bk);color:#fff;border-color:var(--bk)}
.d.Cleaning{background:var(--cl);color:#222;border-color:var(--cl)}
.d.Maintenance{background:var(--mt);color:#fff;border-color:var(--mt)}
.d.past{opacity:.45}
.lg span{display:inline-block;margin-right:12px;font-size:.85rem}
.lg b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--bd)}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd);padding:4px 10px}
input{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.res{margin-top:8px;font-weight:600}.ok{color:#2f9e6b}.no{color:var(--bk)}
.note{background:#fff3cd;color:#664d03;padding:8px 12px;border-radius:8px;font-size:.85rem}
</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
/* ===== EDIT THIS PART ===== */
const CONFIG={
  shop:'Miss Vy Dress Rentals',
  messenger:'',
  cleanDays:2,
  dressesCsv:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsJn5htMqUJg3V-3ZgvAHEQ7HH0r1IWCrfdbwgvHLYGVkUPjV2XeuQhniUWqlgMMF_Hi3iukNI4MRn/pub?gid=19182527&single=true&output=csv',
  bookingsCsv:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsJn5htMqUJg3V-3ZgvAHEQ7HH0r1IWCrfdbwgvHLYGVkUPjV2XeuQhniUWqlgMMF_Hi3iukNI4MRn/pub?gid=596640199&single=true&output=csv'
};
/* ========================== */
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const today=iso(new Date());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col={Booked:'var(--bk)',Cleaning:'var(--cl)',Maintenance:'var(--mt)',Available:'#2f9e6b'};
let S={dresses:[],blocks:[]},cur=null,ym=null,demo=false;

function csv(t){const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));}
function nd(s){let m;s=(s||'').trim();
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return m[3]+'-'+p2(m[1])+'-'+p2(m[2]);return ''}

async function load(){
  if(!CONFIG.dressesCsv||!CONFIG.bookingsCsv){demo=true;
    S.dresses=[{id:'D-001',name:'Red Satin Gown',size:'M',price:'₱1,500 / 3 days',desc:'Demo dress.'},{id:'D-002',name:'Blush Tulle Ball Gown',size:'S',price:'₱2,200 / 3 days',desc:'Demo dress.'}];
    S.blocks=[{dress:'D-001',start:addD(today,5),end:addD(today,7),type:'Booked'}];}
  else{
    const get=u=>fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.text()});
    const [a,b]=await Promise.all([get(CONFIG.dressesCsv),get(CONFIG.bookingsCsv)]);
    S.dresses=csv(a).filter(d=>d.id&&(d.hidden||'').toLowerCase()!=='yes');
    S.blocks=csv(b).map(r=>{const t=(r.type||'Booked').toLowerCase();
      return{dress:r.dress,start:nd(r.start),end:nd(r.end||r.start),type:t[0].toUpperCase()+t.slice(1)}}).filter(x=>x.dress&&x.start&&x.end);}
  if(CONFIG.cleanDays>0)S.blocks.filter(b=>b.type==='Booked').forEach(b=>S.blocks.push({dress:b.dress,start:addD(b.end,1),end:addD(b.end,CONFIG.cleanDays),type:'Cleaning'}));
}
const pri={Booked:3,Maintenance:2,Cleaning:1};
const hit=(id,a,b)=>S.blocks.filter(x=>x.dress===id&&x.start<=b&&x.end>=a);
const status=(id,d)=>hit(id,d,d).sort((a,b)=>pri[b.type]-pri[a.type])[0]?.type||'Available';
const img=d=>`<img class="ph" src="photos/${encodeURIComponent(d.id)}.jpg" alt="${esc(d.name)}" onerror="this.outerHTML='<div class=ph>👗</div>'">`;

function render(){const id=decodeURIComponent(location.hash.slice(1)),d=S.dresses.find(x=>x.id===id);
  if(d){if(cur!==id){cur=id;const n=new Date();ym=[n.getFullYear(),n.getMonth()]}detail(d)}else{cur=null;home()}}
function home(){
  let h=`<h1>${esc(CONFIG.shop)}</h1><div class="mut">Tap a dress to see which dates are free.</div>${demo?'<p class="note">Demo data. Add your Google Sheet links in index.html to show your real dresses.</p>':''}<div class="grid">`;
  for(const d of S.dresses){const s=status(d.id,today);
    h+=`<a class="card" href="#${esc(d.id)}">${img(d)}<div class="p"><b>${esc(d.name)}</b><div class="mut">${esc(d.id)} · Size ${esc(d.size)}</div><div class="mut">${esc(d.price)}</div><span class="tag" style="background:${col[s]}">${s==='Available'?'Available today':s+' today'}</span></div></a>`}
  $('#app').innerHTML=h+'</div>';}
function cal(d){const [y,m]=ym,f=new Date(y,m,1),n=new Date(y,m+1,0).getDate();
  let h=`<div class="ch"><button class="s" data-n="-1">‹</button><b>${f.toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="s" data-n="1">›</button></div><div class="g">`+'SMTWTFS'.split('').map(x=>`<i>${x}</i>`).join('');
  for(let i=0;i<f.getDay();i++)h+='<span></span>';
  for(let k=1;k<=n;k++){const ds=iso(new Date(y,m,k));h+=`<span class="d ${status(d.id,ds)} ${ds<today?'past':''}">${k}</span>`}
  return h+'</div>';}
function detail(d){$('#app').innerHTML=`<a href="#">‹ All dresses</a><div class="top" style="margin-top:10px">${img(d)}<div style="flex:1;min-width:200px"><h2>${esc(d.name)}</h2><div class="mut">${esc(d.id)} · Size ${esc(d.size)}</div><div><b>${esc(d.price)}</b></div><p>${esc(d.desc)}</p></div></div>
  <div class="box"><div id="cal">${cal(d)}</div><div class="lg" style="margin-top:10px"><span><b></b>Available</span><span><b style="background:var(--bk)"></b>Booked</span><span><b style="background:var(--cl)"></b>Cleaning</span><span><b style="background:var(--mt)"></b>Unavailable</span></div></div>
  <div class="box"><b>Check your dates</b><div class="row"><input type="date" id="ca" min="${today}"> to <input type="date" id="cb" min="${today}"><button id="ck">Check</button></div><div id="cr" class="res"></div></div>`;}
function check(){const d=S.dresses.find(x=>x.id===cur),a=$('#ca').value,b=$('#cb').value,r=$('#cr');
  if(!a||!b||b<a){r.className='res';r.textContent='Please pick a start and end date.';return}
  if(hit(d.id,a,b).length){r.className='res no';r.textContent='Sorry, not available for those dates.';return}
  r.className='res ok';
  if(CONFIG.messenger){const t=encodeURIComponent(`Hi! I would like to rent ${d.name} (${d.id}) from ${a} to ${b}.`);
    r.innerHTML=`Available!<br><a class="btn" style="margin-top:8px" target="_blank" rel="noopener" href="https://m.me/${encodeURIComponent(CONFIG.messenger)}?text=${t}">Reserve via Messenger</a>`}
  else r.textContent='Available! Message us to reserve.';}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.id==='ck')check();
  else if(t.dataset.n){ym[1]+=+t.dataset.n;if(ym[1]<0){ym[1]=11;ym[0]--}if(ym[1]>11){ym[1]=0;ym[0]++}$('#cal').innerHTML=cal(S.dresses.find(x=>x.id===cur))}});
window.addEventListener('hashchange',render);
load().then(render).catch(()=>{$('#app').innerHTML='<p>Sorry, availability could not be loaded. Please message us directly.</p>'});
</script>
</body>
</html>
